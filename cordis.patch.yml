# dsh-fleet：把 Harness 变成指挥官
#
# 这一行插入 Host 插件：注册 fleet_agents / fleet_dispatch / fleet_status /
# fleet_result / fleet_stop 五个工具，加一段系统提示，并在
# $DSH_HOME/plugin-data/dsh-fleet/runs/ 下维护每个 worker 的运行目录。
#
# 所有字段都可省略（省略即用默认值）。
#
# 接自己的执行体有两处可写，按用途分：
#   1) 想跟着配置走、能被分享的 → 写在这里的 config.agents（或 profile 自己的 patch）
#   2) 只在这台机器上成立（绝对路径、本机端口、私有凭据段）→ 写到
#      $DSH_HOME/plugin-data/dsh-fleet/agents.local.json，例如：
#        { "agents":   [ { "id": "my-agent", "command": "/opt/my-agent/bin/run",
#                          "args": ["--prompt", "{prompt}"] } ],
#          "disabled": [ "some-default-id" ] }
#      该文件不进仓库、不随包发布，覆盖同名 id 的字段。
- insert:
    - id: dsh-fleet
      name: dsh-fleet
      config:
        maxConcurrent: 4      # 同时跑几个 worker
        timeoutSec: 1800      # 单个 worker 的默认截止时间（秒）
        retryLimit: 0         # 失败自动重试次数（0 = 不重试）
        systemPrompt: true    # 是否把军团使用说明注入系统提示
        agents: []            # 额外执行体；留空即只用内置默认条目
        # disabled: [some-id] # 不想让模型看到的花名册条目
